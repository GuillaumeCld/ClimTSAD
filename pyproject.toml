[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-anomaly-case-study"
version = "0.1.0"
description = "Comparative anomaly detection for climate time series"
requires-python = ">=3.10"

[project.scripts]
case-study = "case_study.example:main"

[tool.setuptools]
packages = [
    "anomaly_detection",
    "anomaly_detection.models",
    "anomaly_detection.models.layers",
    "case_study",
]

[tool.setuptools.package-dir]
anomaly_detection = "src/anomaly_detection"
case_study = "case_study"
